<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Étudiants</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">Campus Planner</div>
    <nav>
        <a th:href="@{/}">Accueil</a>
        <a th:href="@{/students}">Étudiants</a>
        <a th:href="@{/teachers}">Enseignants</a>
        <a th:href="@{/groups}">Groupes</a>
        <a th:href="@{/modules}">Modules</a>
        <a th:href="@{/sessions}">Emploi du temps</a>
        <a th:href="@{/evaluations}">Évaluations</a>
    </nav>
    <a class="button ghost" th:href="@{/logout}">Déconnexion</a>
</header>
<main class="page">
    <section class="card">
        <div class="section-head">
            <div>
                <p class="label">Étudiants</p>
                <h2>Liste et affectations</h2>
            </div>
            <a class="button" th:href="@{/students/new}">Ajouter</a>
        </div>
        <table class="table">
            <thead><tr><th>Nom</th><th>Email</th><th>Filière</th><th>Niveau</th><th>Groupe</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.lastName} + ' ' + ${s.firstName}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.fieldOfStudy}"></td>
                <td th:text="${s.level}"></td>
                <td><span class="tag" th:text="${s.groupClass != null ? s.groupClass.name : 'Non affecté'}"></span></td>
                <td class="actions">
                    <a th:href="@{'/students/' + ${s.id} + '/edit'}">Modifier</a>
                    <form th:action="@{'/students/' + ${s.id} + '/delete'}" method="post">
                        <button class="button ghost" type="submit">Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
