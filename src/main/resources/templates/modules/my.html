<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes modules</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">Campus Planner</div>
    <nav>
        <a th:href="@{/}">Accueil</a>
        <a th:href="@{/modules/my}">Mes modules</a>
        <a th:href="@{/sessions/my}">Mon emploi du temps</a>
        <a th:href="${currentUser != null && currentUser.role == T(com.example.campusplanner.model.Role).STUDENT ? @{/evaluations/my} : @{/evaluations}}">Évaluations</a>
    </nav>
    <a class="button ghost" th:href="@{/logout}">Déconnexion</a>
</header>
<main class="page">
    <section class="card">
        <div class="section-head">
            <div>
                <p class="label">Modules</p>
                <h2>Mes modules</h2>
            </div>
        </div>
        <div th:if="${profileMissing}" class="alert">Profil introuvable. Merci de contacter l'administrateur.</div>
        <table class="table">
            <thead>
            <tr>
                <th>Code</th>
                <th>Nom</th>
                <th>Filière</th>
                <th>Semestre</th>
                <th>Responsable</th>
                <th>Groupes</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(modules)}">
                <td colspan="6" class="muted">Aucun module associé.</td>
            </tr>
            <tr th:each="m : ${modules}">
                <td th:text="${m.code}"></td>
                <td th:text="${m.name}"></td>
                <td th:text="${m.fieldOfStudy}"></td>
                <td th:text="${m.semester}"></td>
                <td><span class="tag" th:text="${m.responsibleTeacher != null ? m.responsibleTeacher.lastName : 'Responsable ?'}"></span></td>
                <td>
                    <span class="tag" th:each="g : ${m.groups}" th:text="${g.name}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
