<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes évaluations</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">Campus Planner</div>
    <nav>
        <a th:href="@{/}">Accueil</a>
        <a th:href="@{/modules/my}">Mes modules</a>
        <a th:href="@{/sessions/my}">Mon emploi du temps</a>
        <a th:href="@{/evaluations/my}">Mes évaluations</a>
    </nav>
    <a class="button ghost" th:href="@{/logout}">Déconnexion</a>
</header>
<main class="page">
    <section class="card">
        <div class="section-head">
            <div>
                <p class="label">Évaluations</p>
                <h2>Mes notes</h2>
            </div>
        </div>
        <div th:if="${profileMissing}" class="alert">Profil introuvable. Merci de contacter l'administrateur.</div>
        <table class="table">
            <thead>
            <tr>
                <th>Module</th>
                <th>Type</th>
                <th>Note</th>
                <th>Date</th>
                <th>Remarques</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(evaluations)}">
                <td colspan="5" class="muted">Aucune évaluation disponible.</td>
            </tr>
            <tr th:each="e : ${evaluations}">
                <td th:text="${e.moduleCourse.code}"></td>
                <td th:text="${e.assessmentType}"></td>
                <td th:text="${e.grade}"></td>
                <td th:text="${#temporals.format(e.evaluationDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${e.remarks}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
