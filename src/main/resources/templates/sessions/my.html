<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mon emploi du temps</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">Campus Planner</div>
    <nav>
        <a th:href="@{/}">Accueil</a>
        <a th:href="@{/modules/my}">Mes modules</a>
        <a th:href="@{/sessions/my}">Mon emploi du temps</a>
        <a th:href="${currentUser != null && currentUser.role.name() == 'STUDENT' ? @{/evaluations/my} : @{/evaluations}}">Évaluations</a>
    </nav>
    <a class="button ghost" th:href="@{/logout}">Déconnexion</a>
</header>
<main class="page">
    <section class="card">
        <div class="section-head">
            <div>
                <p class="label">Emploi du temps</p>
                <h2>Mes séances</h2>
            </div>
        </div>
        <div th:if="${profileMissing}" class="alert">Profil introuvable. Merci de contacter l'administrateur.</div>
        <table class="table">
            <thead>
            <tr>
                <th>Module</th>
                <th>Type</th>
                <th>Groupe</th>
                <th>Salle</th>
                <th>Début</th>
                <th>Fin</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(sessions)}">
                <td colspan="6" class="muted">Aucune séance planifiée.</td>
            </tr>
            <tr th:each="s : ${sessions}">
                <td th:text="${s.moduleCourse.code}"></td>
                <td th:text="${s.sessionType}"></td>
                <td th:text="${s.groupClass.name}"></td>
                <td th:text="${s.room}"></td>
                <td th:text="${#temporals.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(s.endTime, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
